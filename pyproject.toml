[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aios-v0"
version = "0.1.0"
description = "Stateful orchestration layer for a human + heterogeneous AI company"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlmodel>=0.0.24",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9", "mypy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aios/api/*.py" = ["B008"]
